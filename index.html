<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Portfolio de Product Design de Sarah Rodrigues: cases Campus John Deere, Rotik, MyCapital, App Juntos e App Cursiva.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Geist+Mono:wght@400;500&display=swap">
<style>
html{-webkit-text-size-adjust:100%} body{margin:0} img{max-width:100%} [hidden]{display:none!important}
/* Layout: o portfolio é um canvas de design — projetos aparecem como frames rotulados, com seleção azul no hover */
:root{
  --canvas:#EEF0F3; --surface:#FFFFFF; --ink:#15171C; --muted:#5B616C; --line:#D6DAE0;
  --select:#0A8CEB; --on-select:#FFFFFF; --cursor:#D9327A; --dot:#C9CED6;
  --f-display:"Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --f-body:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --s-hero:clamp(2.1rem, 5.4vw, 4.4rem); --s-h1:clamp(1.9rem, 4vw, 3.1rem); --s-h2:clamp(1.35rem, 2.2vw, 1.7rem);
  --s-body:1.0625rem; --s-small:.875rem; --s-label:.75rem;
  --wrap:1180px; --read:680px; --gutter:clamp(16px, 4vw, 40px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --canvas:#1B1C20; --surface:#25272C; --ink:#ECEDEF; --muted:#9CA2AC; --line:#373A41;
  --select:#3BA9FF; --on-select:#0B1420; --cursor:#FF6FAA; --dot:#34373E; color-scheme:dark}}
:root[data-theme="dark"]{
  --canvas:#1B1C20; --surface:#25272C; --ink:#ECEDEF; --muted:#9CA2AC; --line:#373A41;
  --select:#3BA9FF; --on-select:#0B1420; --cursor:#FF6FAA; --dot:#34373E; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--canvas); color:var(--ink); font:400 var(--s-body)/1.6 var(--f-body); -webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--select); outline-offset:3px; border-radius:2px}
.wrap{max-width:var(--wrap); margin-inline:auto; padding-inline:var(--gutter)}
.mono{font-family:var(--f-mono); font-size:var(--s-label); letter-spacing:.02em}
h1,h2,h3{font-family:var(--f-display); font-weight:600; letter-spacing:-.02em; text-wrap:balance; margin:0}

/* Barra superior */
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:color-mix(in srgb, var(--canvas) 86%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--line)}
.top .wrap{display:flex; align-items:center; justify-content:space-between; gap:16px; padding-block:12px}
.brand{display:flex; align-items:center; gap:10px; text-decoration:none; font-weight:600}
.brand img{width:34px; height:34px; border-radius:50%; object-fit:cover}
.nav{display:flex; gap:clamp(12px,2.4vw,28px); font-size:var(--s-small)}
.nav a{text-decoration:none; color:var(--muted)}
.nav a:hover,.nav a[aria-current="page"]{color:var(--ink)}
@media (max-width:520px){.brand span{display:none}}

/* Hero */
.hero{position:relative; overflow-x:clip; padding-block:clamp(56px,9vw,120px) clamp(40px,6vw,72px);
  background-image:radial-gradient(var(--dot) 1px, transparent 1.2px); background-size:22px 22px; background-position:-11px -11px}
.eyebrow{display:flex; flex-wrap:wrap; gap:8px 18px; color:var(--muted); margin-bottom:24px}
.eyebrow b{color:var(--ink); font-weight:500}
.hero h1{font-size:var(--s-hero); line-height:1.04; letter-spacing:-.035em; max-width:19ch; font-weight:600}
.sel{position:relative; white-space:nowrap}
.sel::before{content:""; position:absolute; inset:.06em -.12em .02em; border:1.5px solid var(--select); pointer-events:none}
.sel i{position:absolute; width:8px; height:8px; background:var(--surface); border:1.5px solid var(--select)}
.sel i:nth-of-type(1){left:-.12em; top:.06em; translate:-50% -50%}
.sel i:nth-of-type(2){right:-.12em; top:.06em; translate:50% -50%}
.sel i:nth-of-type(3){left:-.12em; bottom:.02em; translate:-50% 50%}
.sel i:nth-of-type(4){right:-.12em; bottom:.02em; translate:50% 50%}
.end{position:relative; white-space:nowrap}
.cursor{position:absolute; left:100%; top:40%; margin-left:.15em; display:flex; align-items:flex-start; gap:2px; pointer-events:none;
  animation:drift 6s ease-in-out infinite}
.cursor svg{width:18px; height:18px; flex:none}
.cursor span{font:500 12px/1 var(--f-body); letter-spacing:0; background:var(--cursor); color:#fff; padding:5px 8px; border-radius:2px 10px 10px 10px; margin-top:12px}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(10px,6px)}}
.hero-links{display:flex; flex-wrap:wrap; gap:12px; margin-top:40px}
.btn{display:inline-flex; align-items:center; gap:8px; padding:10px 18px; border-radius:999px; border:1px solid var(--line); background:var(--surface); text-decoration:none; font-size:var(--s-small); font-weight:500; cursor:pointer; color:var(--ink); font-family:var(--f-body)}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink); color:var(--canvas); border-color:var(--ink)}
.btn.primary:hover{background:var(--select); border-color:var(--select); color:var(--on-select)}

/* Seções */
section.block{padding-block:clamp(48px,7vw,96px)}
.sec-head{display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:28px; padding-bottom:14px; border-bottom:1px solid var(--line)}
.sec-head h2{font-size:var(--s-h2)}
.sec-head .mono{color:var(--muted)}

/* Frames de projeto */
.frames{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:clamp(28px,4vw,48px) clamp(20px,3vw,36px)}
.frames .frame:first-child{grid-column:1/-1}
@media (max-width:720px){.frames{grid-template-columns:minmax(0,1fr)}}
.frame{display:block; text-decoration:none; color:inherit}
.frame-label{display:flex; justify-content:space-between; gap:12px; color:var(--muted); margin-bottom:8px}
.frame-label span:first-child::before{content:"#"; margin-right:6px; opacity:.6}
.frame-box{position:relative; background:var(--surface); aspect-ratio:3/2; overflow:visible}
.frames .frame:first-child .frame-box{aspect-ratio:16/8}
.frame-box img{width:100%; height:100%; object-fit:cover; display:block}
.frame-box::after{content:attr(data-size); position:absolute; left:50%; bottom:-11px; translate:-50% 0; background:var(--select); color:var(--on-select); font:500 11px/1 var(--f-mono); padding:4px 6px; border-radius:3px; opacity:0; transition:opacity .15s}
.frame-box .h{position:absolute; width:9px; height:9px; background:var(--surface); border:1.5px solid var(--select); opacity:0; transition:opacity .15s}
.frame-box .h:nth-of-type(1){left:-5px; top:-5px} .frame-box .h:nth-of-type(2){right:-5px; top:-5px}
.frame-box .h:nth-of-type(3){left:-5px; bottom:-5px} .frame-box .h:nth-of-type(4){right:-5px; bottom:-5px}
.frame:hover .frame-box,.frame:focus-visible .frame-box{outline:1.5px solid var(--select)}
.frame:hover .frame-box::after,.frame:hover .h,.frame:focus-visible .h,.frame:focus-visible .frame-box::after{opacity:1}
.frame:hover .frame-label span:first-child{color:var(--select)}
.frame:focus-visible{outline:none}
.frame-text{margin-top:18px; display:grid; gap:4px}
.frame-text h3{font-size:clamp(1.15rem,1.8vw,1.4rem); line-height:1.25; font-weight:600}
.frame-text p{margin:0; color:var(--muted); font-size:var(--s-small)}

/* Processo */
.steps{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:clamp(20px,3vw,40px); counter-reset:s}
@media (max-width:820px){.steps{grid-template-columns:minmax(0,1fr)}}
.step{border-top:2px solid var(--ink); padding-top:18px}
.step .mono{color:var(--select)}
.step h3{font-size:1.35rem; margin:8px 0 10px}
.step p{margin:0; color:var(--muted); font-size:.98rem}

/* Experiência */
.xp{display:grid; gap:0}
.xp-row{display:grid; grid-template-columns:120px minmax(0,1fr); gap:8px 32px; padding-block:22px; border-bottom:1px solid var(--line)}
.xp-row:first-child{border-top:1px solid var(--line)}
.xp-row .mono{color:var(--muted); padding-top:5px; font-variant-numeric:tabular-nums}
.xp-row h3{font-size:1.2rem}
.xp-row h3 small{font:400 var(--s-small) var(--f-body); color:var(--muted); letter-spacing:0; margin-left:8px}
.xp-row p{margin:6px 0 0; color:var(--muted); max-width:70ch; font-size:.98rem}
.xp-row ul{margin:10px 0 0; padding-left:1.1em; display:grid; gap:4px; color:var(--muted); font-size:.95rem; max-width:70ch}
.xp-row ul.tight{margin:0; color:var(--ink)}
.xp-row ul.tight b{font-weight:600}
.xp-row li::marker{color:var(--select)}
@media (max-width:600px){.xp-row{grid-template-columns:minmax(0,1fr)}}
.duo{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:clamp(28px,5vw,64px)}
@media (max-width:820px){.duo{grid-template-columns:minmax(0,1fr)}}
.duo .xp-row{grid-template-columns:100px minmax(0,1fr)}
.tools{margin:0; display:grid; gap:0}
.tools div{padding-block:18px; border-bottom:1px solid var(--line)}
.tools div:first-child{border-top:1px solid var(--line)}
.tools dt{color:var(--muted); margin-bottom:10px}
.tools dd{margin:0; display:flex; flex-wrap:wrap; gap:8px}
.tools dd span{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:4px 10px; font-size:var(--s-small)}

/* Contato */
.contact{background:var(--ink); color:var(--canvas); margin-top:clamp(40px,6vw,80px)}
.contact .wrap{padding-block:clamp(56px,8vw,104px) 32px}
.contact h2{font-size:var(--s-hero); line-height:1; letter-spacing:-.035em}
.mail{display:flex; flex-wrap:wrap; align-items:center; gap:12px 16px; margin-top:28px}
.mail a{font:500 clamp(1.15rem,2.6vw,1.8rem)/1.2 var(--f-display); text-decoration-thickness:1px; text-underline-offset:6px; word-break:break-all}
.mail button{font:500 var(--s-label) var(--f-mono); background:transparent; color:inherit; border:1px solid color-mix(in srgb, var(--canvas) 35%, transparent); border-radius:999px; padding:7px 12px; cursor:pointer}
.mail button:hover{border-color:var(--canvas)}
.c-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:24px; margin-top:56px; padding-top:28px; border-top:1px solid color-mix(in srgb, var(--canvas) 22%, transparent)}
.c-grid .mono{opacity:.6; display:block; margin-bottom:6px}
.c-grid a{text-decoration:none; display:block; line-height:1.9}
.c-grid a:hover{text-decoration:underline}
.c-foot{margin-top:56px; opacity:.55}

/* Página de case */
.case-head{padding-block:clamp(40px,6vw,72px) 32px}
.back{display:inline-flex; gap:8px; align-items:center; color:var(--muted); text-decoration:none; margin-bottom:28px}
.back:hover{color:var(--ink)}
.case-head .frame-label{max-width:var(--read)}
.case-head h1{font-size:var(--s-h1); line-height:1.08; max-width:22ch; margin-top:6px}
.meta{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:20px; margin-top:36px; padding-top:20px; border-top:1px solid var(--line)}
.meta .mono{color:var(--muted); display:block; margin-bottom:4px}
.meta div{font-size:.95rem; min-width:0}
.case-cover{background:var(--surface); outline:1.5px solid var(--select); position:relative; margin-top:8px}
.case-cover img{display:block; width:100%; aspect-ratio:16/8; object-fit:cover}
.case-body{display:grid; grid-template-columns:200px minmax(0,1fr); gap:clamp(24px,5vw,72px); padding-block:clamp(48px,6vw,80px)}
@media (max-width:900px){.case-body{grid-template-columns:minmax(0,1fr)} .toc{display:none}}
.toc{position:sticky; top:calc(env(safe-area-inset-top,0px) + 84px); align-self:start; display:grid; gap:2px}
.toc .mono{color:var(--muted); margin-bottom:10px}
.toc button{all:unset; cursor:pointer; font-size:var(--s-small); color:var(--muted); padding:4px 0 4px 12px; border-left:1.5px solid var(--line)}
.toc button:hover{color:var(--ink)}
.toc button.on{color:var(--ink); border-left-color:var(--select)}
.toc button:focus-visible{outline:2px solid var(--select)}
.prose{max-width:var(--read); min-width:0}
.prose h2{font-size:var(--s-h2); margin:56px 0 14px; scroll-margin-top:96px}
.prose > h2:first-child{margin-top:0}
.prose h4{font:600 1rem/1.4 var(--f-body); margin:22px 0 4px}
.prose p{margin:0 0 14px}
.prose ul,.prose ol{margin:0 0 16px; padding-left:1.2em; display:grid; gap:6px}
.prose li::marker{color:var(--muted)}
.prose a{text-decoration-color:var(--select); text-underline-offset:3px}
.prose a:hover{color:var(--select)}
.lead{font-size:1.2rem; line-height:1.5}
.callout{border-left:2px solid var(--select); padding:4px 0 4px 18px; margin:20px 0; font:500 1.15rem/1.45 var(--f-display); letter-spacing:-.01em}
.prose figure{margin:28px 0; max-width:none}
.prose figure button{all:unset; display:block; cursor:zoom-in; width:100%; background:var(--surface); border:1px solid var(--line)}
.prose figure button:hover{outline:1.5px solid var(--select)}
.prose figure button:focus-visible{outline:2px solid var(--select)}
.prose figure img{display:block; width:100%; height:auto}
.prose figcaption{color:var(--muted); margin-top:8px}
@media (min-width:1100px){.prose figure{margin-right:-120px}}
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); margin:24px 0}
.stats div{background:var(--surface); padding:18px}
.stats b{display:block; font:600 2.2rem/1 var(--f-display); letter-spacing:-.03em; font-variant-numeric:tabular-nums}
.stats span{display:block; color:var(--muted); font-size:var(--s-small); margin-top:6px}
.quotes{display:grid; gap:14px; margin:18px 0}
.quotes blockquote{margin:0; background:var(--surface); border:1px solid var(--line); padding:18px 20px}
.quotes blockquote p{margin:0}
.quotes cite{display:block; margin-top:10px; font:500 var(--s-label) var(--f-mono); color:var(--muted); font-style:normal}
.story{list-style:none; padding:0!important; border-left:1px solid var(--line)}
.story li{padding:2px 0 8px 18px; position:relative}
.story li::before{content:""; position:absolute; left:-4px; top:.65em; width:7px; height:7px; border-radius:50%; background:var(--cursor)}
.story b{font-weight:600}
.defs{display:grid; gap:14px; margin:16px 0}
.defs div{border-top:1px solid var(--line); padding-top:12px}
.defs dt{font-weight:600}
.defs dd{margin:4px 0 0; color:var(--muted)}
.linkrow{display:flex; flex-wrap:wrap; gap:10px; margin:16px 0}
.note{color:var(--muted); font-size:var(--s-small); border-top:1px solid var(--line); padding-top:14px; margin-top:28px}
.next{display:flex; justify-content:space-between; align-items:center; gap:20px; flex-wrap:wrap; padding-block:28px; border-top:1px solid var(--line)}
.next a{text-decoration:none}
.next a:hover h3{color:var(--select)}
.next h3{font-size:var(--s-h2)}

/* Sobre */
.about{display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:clamp(28px,6vw,80px); padding-block:clamp(48px,7vw,96px) 24px; align-items:start}
@media (max-width:820px){.about{grid-template-columns:minmax(0,1fr)}}
.about h1{font-size:var(--s-h1); line-height:1.08; margin-bottom:24px; max-width:18ch}
.about p{max-width:62ch}
.portrait .frame-label{margin-bottom:8px}
.portrait .frame-box{aspect-ratio:4/5; outline:1.5px solid var(--select)}
.portrait .frame-box .h{opacity:1}

/* Lightbox */
dialog{border:0; padding:0; max-width:min(1400px,96vw); max-height:94vh; background:var(--surface); color:var(--ink)}
dialog::backdrop{background:rgba(10,12,16,.82)}
dialog img{display:block; max-width:100%; height:auto}
dialog .close{position:sticky; top:0; display:flex; justify-content:flex-end; padding:8px; background:var(--surface)}

.toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); translate:-50% 0; background:var(--ink); color:var(--canvas); padding:10px 16px; border-radius:999px; font-size:var(--s-small); z-index:50}

@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>

</head>

</header>

<main id="app"></main>

<footer class="contact" id="contato">

  ['h','Processo'],
  ['p','O primeiro passo foi organizar todas as informações levantadas nas reuniões com o time Samba e o time interno do Campus John Deere e entender como o novo fluxo híbrido deveria funcionar na prática. A partir disso, comecei a rascunhar os primeiros wireframes, focando nas áreas principais:'],
  ['ul',['<b>Fluxo do aluno:</b> jornada clara desde a inscrição até a conclusão do curso (online + presencial).','<b>Fluxo do instrutor (CDI):</b> criação de turmas, visualização de alunos e acompanhamento do progresso.']],
  ['p','O objetivo nessa etapa era criar uma estrutura simples o bastante para orientar o usuário, mas completa o suficiente para comportar todas as necessidades do Campus.'],
  ['h','Pesquisa'],
  ['p','Para compreender o funcionamento real dos treinamentos e identificar como o fluxo híbrido poderia aprimorar a experiência dos usuários, realizamos uma pesquisa de campo na sede oficial de treinamento da John Deere, em Campinas (SP). Durante essa etapa, utilizamos os seguintes métodos:'],
  ['defs',[['Pesquisa de campo','Visitamos o centro de treinamento para entender, na prática, a dinâmica dos cursos presenciais: desde a chegada dos participantes até a execução das atividades técnicas e operacionais. Isso nos permitiu visualizar claramente gargalos, dependências e oportunidades de melhoria no fluxo.'],['Entrevistas presenciais com o Instrutor Líder','Conversamos exclusivamente com o instrutor líder, responsável por supervisionar e conduzir os treinamentos. Também nos reunimos com o time responsável pelo Campus.']]],
  ['img','hhdjjb4CKp4OmUlwbRdqf8AG7Y.png'],
  ['h','Descobertas'],
  ['p','Após apresentar a primeira proposta do fluxo híbrido para o time do Campus John Deere e para o instrutor líder, alguns pontos importantes ficaram evidentes:'],
  ['ul',['<b>Clareza na jornada híbrida:</b> o time destacou que era essencial deixar explícito que o curso começa no online e depois segue para o presencial, evitando confusão e retrabalho no suporte.','<b>As notificações entre etapas precisavam ser mais automáticas:</b> surgiu a necessidade de garantir que os alunos recebessem e-mails a cada avanço no curso, mantendo todos alinhados sem depender de ações manuais.','<b>A entrega de certificados precisava ser simplificada:</b> o processo atual exigia muitas etapas dos instrutores, e seria ideal automatizar ou facilitar a geração e o envio do certificado ao final do curso.']],
  ['h','Fluxo do aluno'],
  ['p','Iniciei pelo caminho do aluno, desde o momento em que ele acessa o Campus John Deere até a conclusão do curso. O objetivo era criar uma jornada simples e instrutiva:'],
  ['ol',['Ao entrar no Campus, o aluno encontra a categoria de Cursos Híbridos já com informações claras sobre como o processo funciona (compra presencial + liberação online).','Após adquirir o curso presencialmente, ele recebe automaticamente um e-mail com o acesso à etapa online.','Ao clicar no link enviado, é redirecionado para o Campus, onde a etapa online já está liberada.','A partir daí recebe novas notificações conforme progride, avança para a etapa presencial e, ao final do prático, tem acesso ao certificado.']],
  ['p','Esse fluxo buscou reduzir dúvidas comuns, reforçar o entendimento da jornada híbrida e criar uma experiência mais orientada e contínua.'],
  ['img','Df87gZL36JkZJSKRFS8Td6rYmYs.png'],['img','W5RtJiEZdxPumalEZzmBLR2THU.png'],
  ['h','Fluxo do instrutor'],
  ['p','Na visão do instrutor, foquei na simplificação e organização.'],
  ['ol',['O instrutor cria sua turma.','Adiciona manualmente os 12 alunos que participarão da etapa presencial.','Ao adicionar cada aluno, o sistema envia automaticamente o mesmo e-mail inicial de acesso, garantindo que todos entrem no fluxo certo, sem trabalho operacional extra.','A partir daí, o aluno segue o percurso natural da jornada online, e o instrutor pode acompanhar o avanço quando necessário.','Após finalizar todas as etapas, o instrutor pode exportar o certificado de cada aluno.']],
  ['p','Essa arquitetura permitiu equilibrar autonomia para os instrutores e clareza para os alunos, reduzindo retrabalho e garantindo que todos começassem e finalizassem o curso no tempo certo.'],
  ['img','SJ5vLc3Qo3KZNNms88MvXUKPhoE.png'],
  ['h','Dashboard do ADM Master'],
  ['p','Além das jornadas operacionais, também criamos uma visão estratégica para o ADM Master (John Deere), responsável por acompanhar a performance geral dos treinamentos:'],
  ['ul',['Desenvolvemos uma dashboard com relatórios completos sobre abertura de turmas, quantidade de alunos, quantidade de turmas abertas por curso e por instrutores.','Essa visão permitiu que a John Deere acompanhasse resultados em tempo real, tomasse decisões sobre novos treinamentos e entendesse o impacto do novo modelo híbrido.']],
  ['img','87GoJp1fQ5RxpBr22kjpQ8YQ.png'],
  ['h','Resultado final'],
  ['p','Ao longo do projeto, consegui estruturar um novo fluxo completo para os cursos híbridos do Campus, reunindo jornadas de alunos, instrutores e administradores em uma experiência clara, organizada e muito mais intuitiva. A entrega incluiu:'],
  ['ul',['Um fluxo híbrido repensado, reduzindo dúvidas e tornando a jornada mais linear.','Uma experiência mais autônoma para instrutores, com criação de turmas e disparos automáticos de e-mail.','Uma dashboard estratégica para o ADM Master, permitindo acompanhar resultados e desempenho das turmas em tempo real.','Protótipos navegáveis estruturados com foco em clareza, usabilidade e redução de tarefas manuais dentro do Campus.']],
  ['p','O feedback interno da John Deere foi bastante positivo, especialmente sobre a organização da jornada híbrida e a facilidade de navegação entre as etapas do curso. O projeto foi entregue em setembro de 2025 e implementado pela equipe da Samba Tech e John Deere. Por questões de transição de contrato, não acompanhei os resultados pós-lançamento.'],
  ['h','Este projeto me permitiu'],
  ['ul',['Aprimorar minhas habilidades em Arquitetura da Informação, organizando três jornadas diferentes em um fluxo coeso.','Trabalhar diretamente com soluções educacionais corporativas, entendendo limitações, necessidades operacionais e o impacto real da experiência no dia a dia de instrutores e alunos.','Implementar melhorias orientadas a problemas reais levantados pelo time da John Deere, reforçando minha atuação estratégica como UX Designer.','Criar fluxos e protótipos que equilibram simplicidade, clareza e responsabilidade técnica, considerando a escala dos treinamentos da marca.']],
  ['h','Considerações'],
  ['p','Participar desse projeto foi uma experiência muito enriquecedora. Foi desafiador transformar processos complexos, como treinamentos híbridos e gerenciamento de turmas, em uma experiência fluida e fácil de seguir.'],
  ['p','Com base nas necessidades apresentadas pela John Deere, consegui entregar soluções práticas, claras e escaláveis, que fortalecem o uso do Campus e facilitam o trabalho dos instrutores e administradores. Esse case demonstra minha capacidade de:'],
  ['ul',['desenhar fluxos completos de ponta a ponta,','traduzir necessidades operacionais em experiências intuitivas,','e propor soluções que realmente funcionam dentro da realidade do cliente.']],
  ['note','Alguns dados deste case foram ocultados devido a NDA.']
  ]},

{ id:'rotik', name:'Rotik', year:'2022–2025', cover:'68Im7MZg1axZkVzKKJjUyEDc.png', size:'1440 × 1024',
  title:'Rotik, transformando a comunicação entre empresas e clientes',
  card:'Product Designer Pleno · +614 mi de execuções até 2024',
  meta:[['Período','2022–2025'],['Papel','Product Designer Pleno, de ponta a ponta'],['Contexto','Huggy, depois Rotik (grupo GoPWR)'],['Entregas','Pesquisa, arquitetura e interface do zero']],
  body:[
  ['h','Sobre'],
  ['p','O Rotik é um produto que nasceu em 2022 dentro da empresa Huggy, com o nome de Automator (MVP). No final de 2023, após algumas decisões internas, o produto passou a se chamar Rotik e atualmente faz parte do grupo de empresas GoPWR, tornando-se uma startup em crescimento.'],
  ['h','Meu papel'],
  ['p','Minhas principais responsabilidades foram: criação do fluxo de usuário, layout com wireframes de baixa a alta fidelidade, arquitetura de informação, pesquisa, entrevistas com usuários, execução de testes de usabilidade e visão e estratégia de design de médio a longo prazo.'],
  ['h','Objetivo'],
  ['callout','Automatizar processos e entregar economia de tempo para gestores através de uma ferramenta de disparos em massa.'],
  ['img','NmM6TzleEH4Iyt11ln3sE115yEc.png'],
  ['h','Contexto'],
  ['p','No projeto da Rotik, identificamos um problema comum em empresas: o excesso de tarefas manuais e repetitivas, como envio de cobranças, mensagens comemorativas e campanhas no WhatsApp, além do encerramento de atendimentos em plataformas como a Huggy. Essas ações, quando feitas manualmente, comprometem a produtividade e o engajamento das equipes.'],
  ['stats',[['91%','das empresas querem automatizar processos (Salesforce)'],['39%','dos setores de pesquisa e serviços administrativos veem a automação como essencial para crescer']]],
  ['h','Desafio'],
  ['p','Diante desse cenário, meu principal desafio foi construir do zero a interface da Rotik, com foco em resolver uma dor clara dos usuários da Huggy: o excesso de tarefas manuais.'],
  ['p','Foi nesse contexto que nasceu a Rotik, uma solução de automação que reduz a necessidade de intervenção humana em tarefas operacionais, tornando os processos mais ágeis e eficientes.'],
  ['p','Nosso objetivo de alto nível com o projeto era claro: melhorar a relação entre nossos clientes e seus consumidores, simplificando processos e devolvendo tempo às equipes por meio de tecnologia e suporte contínuo.'],
  ['h','Começo'],
  ['p','Na primeira semana do projeto, em 2022, nossa equipe mergulhou em uma sprint de 7 dias intensos de geração de ideias, idealização e planejamento. Durante esse período, reunimos todo o time e realizamos discussões e workshops liderados pelo nosso PM, onde as ideias fluíram livremente e sem restrições.'],
  ['p','Usamos nesse momento alguns exercícios criativos como o Crazy 8, brainstorming e canvas MVP, e exploramos inúmeras abordagens e possibilidades.'],
  ['links',[['Ver Crazy 8’s','https://drive.google.com/file/d/1ldi542ClkF5gumFlUli-XP9_oKC5hGfF/view?usp=sharing'],['Ver brainstorming','https://drive.google.com/file/d/1zDE7-V9tKfFfkA4TKTGjflNpQVyfAOz9/view?usp=sharing']]],
  ['img','aMvsWtnDi0bX50GUVEXOAyIWvyE.jpg'],
  ['h','MVP'],
  ['p','Após a fase de ideação e pesquisas com colaboradores da Huggy, desenvolvemos uma versão enxuta da Rotik focada nos recursos essenciais para o MVP. Nesse período o projeto tinha o nome de Automator.'],
  ['p','Inicialmente, apenas 5 empresas testaram a ferramenta. Acompanhamos o uso de perto com ferramentas como FullStory e sessões de demonstração internas, o que nos permitiu coletar feedbacks valiosos e priorizar melhorias. Em 3 meses, entregamos a versão beta e, com ela, alcançamos os primeiros resultados:'],
  ['stats',[['5','empresas no teste inicial'],['56','clientes pagantes em 3 meses'],['+1 mi','execuções automatizadas']]],
  ['p','Abaixo, algumas imagens da primeira versão da plataforma.'],
  ['img','xiTN2X0yn2aAjbbLdPa9C3W0NbE.png'],
  ['h','Mudança de rota'],
  ['p','Os resultados do MVP superaram as expectativas e validaram a proposta de valor do produto. A partir desse desempenho, foi tomada uma decisão estratégica interna: transformar a Rotik em uma nova empresa dentro do grupo GoPWR, com time e estrutura próprios para escalar a solução.'],
  ['p','Essa mudança marcou o início de uma nova fase, com foco no crescimento e na consolidação da Rotik como plataforma de automação.'],
  ['stats',[['+614 mi','execuções realizadas pelo produto até 2024']]],
  ['h','Descobertas'],
  ['p','Iniciamos uma pesquisa para entender melhor nossos clientes e mapear percepções sobre o uso do MVP, com o objetivo de direcionar a versão 2.0 do produto.'],
  ['p','Levantamos desafios, prazos e stakeholders envolvidos. Realizamos um workshop com a Matriz CSD, focado na usabilidade e nas expectativas para a nova versão. A seguir, estão os principais pontos levantados durante esse processo.'],
  ['img','GW0iXqJKWuUcEaAeqMTm2v6McM.png'],
  ['h','Problemas'],
  ['p','Após a construção da Matriz CSD, tornou-se muito mais fácil definir as perguntas usadas na pesquisa quantitativa por formulário (com perguntas abertas e fechadas), além das entrevistas com os usuários. A seguir, alguns dos principais problemas que identificamos:'],
  ['img','Aa31nvrXCnO2XW0L5r7VN5S6Yw.png'],
  ['h','Comentários'],
  ['quotes',[['A parte mais desafiadora foi integrar a ferramenta ao processo interno da empresa, mas, no geral, a plataforma é dinâmica e fácil de usar. Mas reconheço que pode ser complicado para outras pessoas da equipe se tornarem responsáveis sem treinamento… A principal dificuldade e ponto de dor ao usar o Automator é a impossibilidade de criar fluxos cadenciados como desejado.','Cliente 01'],['Nosso uso mais comum do Automator é para mensagens de relacionamento, como alertas de agendamento, faturas geradas, vencimento, cobrança e bloqueio… Uma dificuldade inicial foi o manuseio de planilhas.','Cliente 02'],['O suporte ao Automator é caótico. A paginação, o carregamento das opções, relatórios, precisam ser melhorados. O formato de criação de tarefas necessita melhor acabamento…','Cliente 03'],['Acho que o dashboard é muito ruim, precisa melhorar, ter relatórios mais completos, por tarefa, por dia, filtros…','Cliente 04']]],
  ['h','Análise'],
  ['p','A partir dos principais comentários, identificamos que os usuários do Automator enfrentavam desafios ao integrar a ferramenta aos processos internos das empresas e gostariam de criar os fluxos desejados e realizar integrações específicas com outras ferramentas.'],
  ['p','Outro ponto levantado foi a dificuldade no manuseio de planilhas e o desejo de disparar mensagens em vários canais. Nosso suporte ao cliente estava inconsistente, como expresso pelo Cliente 03, e o dashboard precisava de melhorias significativas, como relatórios mais detalhados, conforme o Cliente 04.'],
  ['h','Persona'],
  ['p','Antes de iniciar a criação da jornada e priorizar funcionalidades da versão 2.0, definimos a persona principal com base nas entrevistas realizadas, para ter mais clareza de quem são os principais usuários da plataforma.'],
  ['p','Optamos por manter o foco em apenas uma persona: o gestor interno responsável pelo uso da Rotik no dia a dia. Isso foi importante para criarmos foco na hora de melhorar o produto. Descobrimos também o que nossos clientes precisavam, quais eram seus problemas atuais, dores e expectativas.'],
  ['img','XGTLQI7lfrS9np2ywTpDCpGIg.png'],
  ['h','Jobs To Be Done'],
  ['p','Com os dados da persona, definimos nosso Jobs To Be Done, que nos permite avaliar o que as pessoas querem realizar com nosso produto. Seguindo essa premissa:'],
  ['defs',[['A tarefa','Qual é a tarefa que o nosso usuário pretende resolver ao usar o produto?'],['Aspectos funcionais','Qual problema funcional ele está tentando resolver com essa tarefa?'],['Aspectos emocionais pessoais','Qual problema emocional interno a pessoa pretende sanar?'],['Aspectos emocionais sociais','Qual problema emocional externo?']]],
  ['img','Zh4eBMyGTbFAXvLVtrqPS8W7n6U.png'],
  ['h','Competidores'],
  ['p','Após a criação da persona e do Jobs To Be Done, nosso objetivo foi aprofundar a compreensão do cenário em que o produto estava inserido. Conduzi uma pesquisa de mercado considerando, nesse primeiro momento, apenas as funcionalidades disponíveis nos concorrentes, com foco em automação de processos.'],
  ['p','Essa análise trouxe insights sobre as tendências do setor e identificou pontos de estratégia e áreas em que poderíamos aprimorar nossa posição competitiva.'],
  ['img','NJYlDiPaOZvIvg95i14UYkSlk.png'],
  ['h','Técnica MoSCoW'],
  ['p','Com as definições feitas, olhamos para as oportunidades vindas da análise de competidores e dos feedbacks da pesquisa, e usamos a matriz MoSCoW para priorizar requisitos e definir quais recursos seriam o foco no desenvolvimento da Rotik.'],
  ['p','Essa abordagem, dividida em Must have, Should have, Could have e Won’t have, permite focar primeiro nas funcionalidades essenciais, seguidas pelas desejáveis, evitando desperdício de tempo e recursos em elementos menos importantes.'],
  ['img','dEBTFitc02thNVYJzYaqQDi9zXc.png'],
  ['h','5 E’s'],
  ['p','Antes de definir o High Concept, mapeei as etapas da jornada do usuário com a técnica dos 5 E’s: Excitement, Entry, Engagement, Exit e Extension. Depois de definidas as etapas principais, quebrei cada uma em passos menores, que representavam as ações em si.'],
  ['img','HaihYKj5So8ZbZTyJuyuOCtOL3U.png'],
  ['h','Jornada do usuário'],
  ['p','Com as etapas da jornada definidas, o desafio era alimentá-las com o olhar da persona. A forma que encontrei foi montar junto com o time: cada pessoa ficou responsável por uma parte da jornada, e no final avaliamos em conjunto.'],
  ['img','yEpiuewEaX5O6JD11neK0cSRvHs.png'],
  ['h','Sitemap'],
  ['p','Com a jornada criada, pensamos na estrutura do sitemap da ferramenta, priorizando clareza, escalabilidade e eficiência na navegação, para que os usuários encontrem rapidamente os recursos de que precisam.'],
  ['p','A organização contempla os módulos centrais da plataforma (Disparo em massa, Contatos, Modelos de mensagens e Integrações), distribuídos de forma lógica e alinhados aos objetivos de comunicação, automação e gestão da Rotik.'],
  ['img','CLPcixwsnzWeWIIjx7U7qyD38.png'],
  ['h','Entrega'],
  ['p','As telas a seguir representam o desdobramento visual e funcional das soluções desenvolvidas ao longo do projeto. A construção da interface foi guiada pelos aprendizados das etapas de pesquisa, definição de oportunidades e validação com usuários.'],
  ['img','uQ75l7VURkyirx0RjGxd9Qtrfyk.png'],['img','j0Y14rv7RFgpGKCiE5R6rrpHsQ.png'],['img','7TnVu5aVsmG7n1gUXiELX3KNRck.png']
  ]},

{ id:'mycapital', name:'MyCapital', year:'2021', cover:'BoA418zrMg5HWyTVu0cqA9X39w.png', size:'1440 × 960',
  title:'MyCapital, descobrindo o usuário através do processo de discovery',
  card:'Product Designer Jr · Fintech · Discovery',
  meta:[['Ano','2021'],['Papel','Product Designer Jr'],['Contexto','Fintech MyCapital (RJ)'],['Foco','Discovery e pesquisa com usuários']],
  body:[
  ['h','Meu papel'],
  ['p','Atuei no time de design de produto, em colaboração com a liderança e a engenharia, na realização de pesquisas, entrevistas com usuários, testes de usabilidade, criação de componentes visuais e apoio nas demandas do dia a dia para todos os times da empresa.'],
  ['h','Visão geral'],
  ['p','No projeto tive a oportunidade de atuar diretamente com minha líder, contribuindo em todas as etapas do processo. Participei ativamente da condução das entrevistas, buscando entender as necessidades, desafios e expectativas dos stakeholders.'],
  ['p','Também fui responsável por organizar e analisar as informações coletadas, extraindo insights das entrevistas e dos formulários aplicados. Em parceria com minha líder, ajudei a desenvolver uma apresentação estratégica, onde destacamos os principais achados e propusemos soluções alinhadas aos objetivos da empresa.'],
  ['p','Essa experiência foi fundamental para garantir um processo bem estruturado e resultados claros, que apoiaram a tomada de decisões estratégicas no projeto.'],
  ['h','Acesso'],
  ['callout','Este projeto está sob NDA. Para visualizá-lo é necessário senha. Se quiser mais informações, me mande um e-mail.'],
  ['links',[['Abrir estudo protegido','https://drive.google.com/file/d/14yPAnv274UezC3GUjj_2zdJv3GWAb1_B/view?usp=sharing']]],
  ['img','BnRS6YKVDtpadHaNYn4UPXv7A0.png']
  ]},

{ id:'juntos', name:'App Juntos', year:'2023', cover:'W8jMW3c3v6k0WIeYy3AAeJG9M.png', size:'390 × 844',
  title:'AppJuntos, facilitando o dia a dia de quem divide moradia',
  card:'UX/UI Designer · App mobile',
  meta:[['Ano','2023'],['Papel','UX/UI Designer'],['Plataforma','Mobile first'],['Entregas','Pesquisa, wireframes e protótipo navegável']],
  body:[
  ['h','Meu papel'],
  ['p','Atuei como UX e UI Designer para construir as interfaces do aplicativo Juntos, que tem como propósito facilitar o dia a dia de quem divide moradia. Meu foco principal foi a criação de uma solução simples e eficaz.'],
  ['img','cGB2lfFGKSwewkAFtrwoQtO2x4Y.png'],
  ['h','Contexto'],
  ['p','Atualmente, 54% da população mundial mora em comunidades urbanas, e a idade média para o casamento é de 29 anos para homens e 27 para mulheres. Esses são alguns dos motivos pelos quais a maioria dos habitantes de grandes cidades passa boa parte dos seus 20 anos morando com colegas. No entanto, dividir tarefas, responsabilidades e contas pode ser muito difícil quando você compartilha uma residência.'],
  ['p','Conta de luz, compras para a casa, aluguel e limpeza são algumas das atribuições que precisam ser bem organizadas e distribuídas entre todos para que haja um bom convívio. Muitas vezes isso vira uma dor de cabeça quando não há controle dessas funções.'],
  ['callout','Precisei desenhar uma experiência que tornasse mais bem administrada a gestão e divisão de contas e tarefas entre as pessoas de uma residência.'],
  ['h','Cenário atual'],
  ['p','Primeiro, foi necessária uma pesquisa inicial para entender comportamentos atuais usando pesquisas já realizadas, dados divulgados por outras empresas ou pelo governo, além dos dados disponíveis na internet, como nas redes sociais.'],
  ['defs',[['Dividir a casa é tendência entre pessoas de 20 a 30 anos','Dividir a casa deixou de ser coisa de estudante. Hoje proliferam nas grandes cidades as chamadas repúblicas tardias, formadas por pessoas de vinte e poucos anos até cinquentões. A maioria dos parceiros se conhece por sites especializados (como o Moove In) e grupos de redes sociais, e é motivada pela possibilidade de dividir as contas, da luz à internet, e pelo alto valor dos aluguéis.'],['Mercado de aluguel compartilhado nas redes sociais','No Facebook, há dezenas de grupos com milhares de pessoas que oferecem espaços ou buscam um cantinho para chamar de seu. Além das redes sociais, existem aplicativos que funcionam como um “match” entre pessoas interessadas em dividir a casa.'],['A demanda','A desk research mostrou que o mercado de compartilhamento de residência é grande e envolve inúmeros problemas, desde questões simples de convivência até discussões mais complexas sobre classe e economia.']]],
  ['h','Pesquisa'],
  ['p','O processo de pesquisa teve que ser enxuto devido ao tempo curto. Por isso, fiz um planejamento simples:'],
  ['ol',['Matriz CSD;','Levantamento de perguntas;','Disparo da survey;','Recolhimento das respostas.']],
  ['p','Usei a matriz CSD (certezas, suposições e dúvidas) para discutir os primeiros dados da desk research. Assim foi possível validar e escolher as melhores perguntas para a survey quantitativa, com algumas perguntas abertas, em busca de compreender melhor quem é o usuário e o problema que enfrenta morando com outras pessoas.'],
  ['callout','Objetivo da pesquisa: entender como as pessoas dividem tarefas domésticas e obrigações financeiras compartilhando moradia.'],
  ['ul',['<b>Usuários:</b> pessoas que dividem apartamento ou casa.','<b>Perguntas:</b> 8 fechadas, 2 abertas.','<b>Amostra:</b> 10 respostas.']],
  ['img','EWNFOrU13lRGOr1nvfPIkeOp3DU.png'],
  ['h','Definição'],
  ['p','Com a pesquisa realizada, criei a persona. Também usei o Pixar Storytelling para contar a história do usuário e como o produto pode gerar valor para ele.'],

          <li>Visão e estratégia de design do produto, com pesquisa, fluxos, protótipos e testes com usuários</li>

        <div class="xp-row"><span class="mono">2021</span><div><h3>MyCapital <small>Product Designer Jr</small></h3><p>Time de design da fintech, em colaboração com a liderança e a engenharia, apoiando as demandas dos times da empresa.</p><ul>
          <li>Participação ativa no discovery do produto B2C, com insights que alimentaram o backlog e novas funcionalidades</li>
          <li>Pesquisas, entrevistas e testes de usabilidade com usuários, além da criação de componentes visuais</li></ul></div></div>
        <div class="xp-row"><span class="mono">2020</span><div><h3>Agência S3</h3><p>Projetos de UI/UX, desdobramento de campanhas e materiais para redes sociais, identidade visual e papelaria corporativa, além de design gráfico como flyers, folders e catálogos.</p></div></div>
      </div>
    </section>
    <section class="block" style="padding-top:0">
      <div class="duo">
        <div>
          <div class="sec-head"><h2>Formação e certificados</h2></div>
          <div class="xp">
            <div class="xp-row"><span class="mono">2016–2024</span><div><h3>Publicidade e Propaganda</h3><p>Graduação · UniRitter</p></div></div>
            <div class="xp-row"><span class="mono">Cursos</span><div><ul class="tight">
              <li><b>UX/UI Design</b> · Design Circuit</li>
              <li><b>UX/UI Design</b> · UX Unicórnio</li>

          <div class="sec-head"><h2>Ferramentas</h2></div>

}

function block(b){
  const [t,v,cap] = b;
  switch(t){
    case 'h': return `<h2 id="s-${slug(v)}">${v}</h2>`;
    case 'p': return `<p>${v}</p>`;
    case 'callout': return `<p class="callout">${v}</p>`;
    case 'note': return `<p class="note">${v}</p>`;
    case 'ul': return `<ul>${v.map(x=>`<li>${x}</li>`).join('')}</ul>`;
    case 'ol': return `<ol>${v.map(x=>`<li>${x}</li>`).join('')}</ol>`;
    case 'img': return `<figure><button type="button" data-zoom="img/${v}" aria-label="Ampliar imagem"><img src="img/${v}" alt="${cap ? esc(cap) : 'Imagem do processo do projeto'}" loading="lazy"></button>${cap?`<figcaption class="mono">${cap}</figcaption>`:''}</figure>`;
    case 'stats': return `<div class="stats">${v.map(([n,l])=>`<div><b>${n}</b><span>${l}</span></div>`).join('')}</div>`;
    case 'quotes': return `<div class="quotes">${v.map(([q,c])=>`<blockquote><p>“${q}”</p><cite>${c}</cite></blockquote>`).join('')}</div>`;
    case 'defs': return `<dl class="defs">${v.map(([d,t])=>`<div><dt>${d}</dt><dd>${t}</dd></div>`).join('')}</dl>`;
    case 'story': return `<ol class="story">${v.map(([k,t])=>`<li><b>${k}</b> ${t}</li>`).join('')}</ol>`;
    case 'links': return `<div class="linkrow">${v.map(([l,h])=>ext(l,h)).join('')}</div>`;
  }
  return '';
}
const slug = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-');

function caseView(p){
  const i = P.indexOf(p), nx = P[(i+1)%P.length];
  const heads = p.body.filter(b=>b[0]==='h').map(b=>b[1]);
  return `
  <div class="wrap">
    <header class="case-head">
      <a class="back mono" href="#projetos">← Todos os projetos</a>
      <div class="frame-label mono"><span>${p.name}</span><span>${p.year}</span></div>
      <h1>${p.title}</h1>
      <div class="meta">${p.meta.map(([k,v])=>`<div><span class="mono">${k}</span>${v}</div>`).join('')}</div>
    </header>
    <div class="case-cover"><img src="img/${p.cover}" alt="Mockup do projeto ${p.name}"></div>
    <div class="case-body">
      <nav class="toc" aria-label="Seções do case"><span class="mono">Neste case</span>${heads.map(h=>`<button type="button" data-to="s-${slug(h)}">${h}</button>`).join('')}</nav>
      <article class="prose">${p.body.map(block).join('')}</article>
    </div>
    <nav class="next" aria-label="Próximo projeto">
      <a class="back mono" href="#projetos" style="margin:0">← Todos os projetos</a>
      <a href="#${nx.id}"><span class="mono" style="color:var(--muted)">Próximo projeto · ${nx.year}</span><h3>${nx.name} →</h3></a>
    </nav>
  </div>`;
}

let spy;
function route(){
  const h = location.hash.slice(1);
  const p = P.find(x=>x.id===h);
  spy && spy.disconnect();
  if(p){ app.innerHTML = caseView(p); document.title = p.name + ' · Sarah Rodrigues'; scrollTo(0,0); setupToc(); }
  else if(h==='sobre'){ app.innerHTML = about(); document.title = 'Sobre · Sarah Rodrigues'; scrollTo(0,0); }
  else {
    if(!app.querySelector('#projetos')) app.innerHTML = home();
    document.title = 'Sarah Rodrigues';
    if(h==='projetos') document.getElementById('projetos').scrollIntoView();
    else if(h==='contato') document.getElementById('contato').scrollIntoView();
    else scrollTo(0,0);
  }
  document.querySelectorAll('[data-nav]').forEach(a=>{
    const on = a.dataset.nav==='sobre' ? h==='sobre' : a.dataset.nav==='projetos' && !!p;
    on ? a.setAttribute('aria-current','page') : a.removeAttribute('aria-current');
  });
}
function setupToc(){
  const btns = [...document.querySelectorAll('.toc button')];
  spy = new IntersectionObserver(es=>{
    es.forEach(e=>{ if(e.isIntersecting){ btns.forEach(b=>b.classList.toggle('on', b.dataset.to===e.target.id)); } });
  },{rootMargin:'-90px 0px -70% 0px'});
  document.querySelectorAll('.prose h2').forEach(h=>spy.observe(h));
}

// "Contato" rola até o rodapé sem trocar a página atual
document.addEventListener('click', e=>{
  const c = e.target.closest('a[href="#contato"]');
  if(c && location.hash.slice(1) && location.hash!=='#contato' && location.hash!=='#projetos'){ e.preventDefault(); document.getElementById('contato').scrollIntoView({behavior:'smooth'}); return; }
  const t = e.target.closest('[data-to]');
  if(t){ document.getElementById(t.dataset.to).scrollIntoView({behavior:'smooth'}); return; }
  const z = e.target.closest('[data-zoom]');
  if(z){ const lb=document.getElementById('lb'); document.getElementById('lb-img').src=z.dataset.zoom; lb.showModal(); }
});
const lb = document.getElementById('lb');
document.getElementById('lb-close').onclick = ()=>lb.close();
lb.addEventListener('click', e=>{ if(e.target===lb) lb.close(); });

document.getElementById('copy-mail').addEventListener('click', async ()=>{
  const txt='criativerods@gmail.com';
  try{ await navigator.clipboard.writeText(txt); toast('E-mail copiado'); }
  catch{ const r=document.createRange(); r.selectNodeContents(document.getElementById('mail')); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast('E-mail selecionado, use Ctrl+C'); }
});
function toast(m){ const t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.append(t); setTimeout(()=>t.remove(),2200); }

addEventListener('hashchange', route);
route();
</script>
